name: Build MT76x8 Tailscale Firmware

on:
  workflow_dispatch:
    inputs:
      profile:
        description: '设备 PROFILE 名称（本设备用 oraybox_x1；输入 list 仅列出所有 mt76x8 profile）'
        required: true
        default: 'oraybox_x1'
        type: string
      tailscale_tag:
        description: 'Tailscale 版本标签（留空 = 自动取最新，如 v1.104.7）'
        required: false
        default: ''
        type: string
      lan_mode:
        description: 'LAN 地址模式：auto = 从主路由 DHCP 自动获取（推荐），static = 固定地址'
        required: false
        default: 'auto'
        type: string
      lan_ip:
        description: '仅 lan_mode=static 时生效：本机静态地址'
        required: false
        default: '192.168.1.2'
        type: string
      lan_gateway:
        description: '仅 lan_mode=static 时生效：主路由地址（网关 + DNS）'
        required: false
        default: '192.168.1.1'
        type: string

  # 推送到 main：只构建、留 artifact，不改版本。
  # 只改文档/配置材料时不触发（固件内容没变）。
  push:
    branches: [main]
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'configs/**'
      - 'patches/**'
      - 'dts/**'
      - '.gitignore'
      - '.gitattributes'

permissions:
  contents: write

# 同一个分支/标签只保留最新一次构建，避免连续推送时排队。
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

env:
  # workflow_dispatch 有输入时用输入；push / tag 触发时 inputs 为空，走默认值。
  PROFILE: ${{ github.event.inputs.profile || 'oraybox_x1' }}
  LAN_MODE: ${{ github.event.inputs.lan_mode || 'auto' }}
  LAN_IP: ${{ github.event.inputs.lan_ip || '192.168.1.2' }}
  LAN_GATEWAY: ${{ github.event.inputs.lan_gateway || '192.168.1.1' }}

  IB_VERSION: '23.05.4'
  IB_TARGET: 'ramips'
  IB_SUBTARGET: 'mt76x8'
  # 单文件 tailscaled（内嵌 CLI），slim 构建；不使用 UPX。
  #
  # 该列表 = 需求指定的 8 个标签 + 为 16MB Flash 追加的必要裁剪项。
  # 生成方式（在 tailscale 源码目录执行）：
  #   go run ./cmd/featuretags --min --add \
  #     serve,cli,osrouter,nattraversal,dns,useroutes,iptables,c2n,portmapper,tailnetlock,ipnbus,health,cliconndiag
  # 保留 serve/netstack 才能用 `tailscale serve`，保留 dns/iptables/useroutes
  # 才能正常解析和接受路由；作为子网路由必须保留 AdvertiseRoutes
  # （不能带 ts_omit_advertiseroutes，否则发布出去的网段不会生效）。
  # 实测 mipsle softfloat 二进制约 20.9 MiB（xz9 约 4.6 MiB）。
  TS_BUILD_TAGS: 'ts_include_cli,ts_omit_ace,ts_omit_acme,ts_omit_advertiseexitnode,ts_omit_androidbin,ts_omit_androiddns,ts_omit_appconnectors,ts_omit_aws,ts_omit_bakedroots,ts_omit_bird,ts_omit_cachenetmap,ts_omit_captiveportal,ts_omit_capture,ts_omit_clientmetrics,ts_omit_clientupdate,ts_omit_cloud,ts_omit_colorable,ts_omit_completion,ts_omit_completion_scripts,ts_omit_conn25,ts_omit_connreject,ts_omit_dbus,ts_omit_debug,ts_omit_debugeventbus,ts_omit_debugportmapper,ts_omit_desktop_sessions,ts_omit_dnsresolvecache,ts_omit_doctor,ts_omit_drive,ts_omit_favorites,ts_omit_flashappliance,ts_omit_gro,ts_omit_hujsonconf,ts_omit_identityfederation,ts_omit_kube,ts_omit_linkspeed,ts_omit_linuxdnsfight,ts_omit_listenrawdisco,ts_omit_logtail,ts_omit_netlog,ts_omit_networkmanager,ts_omit_oauthkey,ts_omit_outboundproxy,ts_omit_peerapiclient,ts_omit_peerapiserver,ts_omit_portlist,ts_omit_posture,ts_omit_qrcodes,ts_omit_relayserver,ts_omit_remoteconfig,ts_omit_resolved,ts_omit_routecheck,ts_omit_runtimemetrics,ts_omit_sdnotify,ts_omit_serviceclientprefs,ts_omit_ssh,ts_omit_synology,ts_omit_syslog,ts_omit_syspolicy,ts_omit_systray,ts_omit_taildrop,ts_omit_tap,ts_omit_tpm,ts_omit_tundevstats,ts_omit_unixsocketidentity,ts_omit_useexitnode,ts_omit_useproxy,ts_omit_usermetrics,ts_omit_wakeonlan,ts_omit_webbrowser,ts_omit_webclient'
  # OrayBox X1 / MT76x8 的 firmware 分区为 0x00f00000 = 15 MiB。
  MAX_FIRMWARE_BYTES: '15728640'

jobs:
  # ======================================================================
  # 阶段 1：Tailscale 二进制
  # 与镜像内容无关，产物 21MB，可以独立复用/重跑。
  # ======================================================================
  tailscale:
    name: Build tailscaled (mipsle)
    if: inputs.profile != 'list'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      ts_tag: ${{ steps.resolve.outputs.tag }}

    steps:
      - name: Resolve Tailscale tag
        id: resolve
        env:
          TS_TAG_INPUT: ${{ inputs.tailscale_tag }}
        run: |
          set -euo pipefail
          if [ -n "$TS_TAG_INPUT" ]; then
            TS_TAG="$TS_TAG_INPUT"
          else
            TS_TAG=$(git ls-remote --tags --refs --sort=-v:refname \
              https://github.com/tailscale/tailscale.git 'refs/tags/v*' \
              | sed 's#.*refs/tags/##' | grep -v -- '-' | head -n 1)
          fi
          [ -n "$TS_TAG" ] || { echo "::error::无法解析 Tailscale 版本"; exit 1; }
          echo "tag=$TS_TAG" >> "$GITHUB_OUTPUT"
          echo "Tailscale 版本: $TS_TAG"

      - name: Checkout Tailscale ${{ steps.resolve.outputs.tag }}
        uses: actions/checkout@v4
        with:
          repository: tailscale/tailscale
          ref: ${{ steps.resolve.outputs.tag }}
          fetch-depth: 1
          path: tailscale

      # 最新 Tailscale 的 go.mod 要求 Go 1.27.x，固定 1.23 会直接编译失败。
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tailscale/go.mod
          cache: true
          cache-dependency-path: tailscale/go.sum

      - name: Cross-compile tailscaled (linux/mipsle softfloat)
        working-directory: tailscale
        env:
          TS_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"

          # 用 -buildvcs=false 时 Go 不会嵌 VCS 信息，Tailscale 读不到就退回
          # "<VERSION.txt>-ERR-BuildInfo"（管理后台里会显示成
          # 1.105.0-ERR-BuildInfo）。这里显式注入版本戳，格式与官方
          # build_dist.sh 的仓库构建一致：x.y.z-t<commit>。
          SHORT="${TS_TAG#v}"
          COMMIT=$(git rev-parse --short=10 HEAD)
          LONG="${SHORT}-t${COMMIT}"
          echo "版本戳: $LONG"

          CGO_ENABLED=0 GOOS=linux GOARCH=mipsle GOMIPS=softfloat \
            go build -trimpath -buildvcs=false \
            -ldflags="-s -w -X tailscale.com/version.longStamp=${LONG} -X tailscale.com/version.shortStamp=${SHORT} -X tailscale.com/version.gitCommitStamp=${COMMIT}" \
            -tags "$TS_BUILD_TAGS" \
            -o "$GITHUB_WORKSPACE/out/tailscaled" ./cmd/tailscaled
          ls -lh "$GITHUB_WORKSPACE/out/"

          # 确认版本戳真的写进了二进制（否则 tailscale 会报 -ERR-BuildInfo）。
          if ! grep -aq "$LONG" "$GITHUB_WORKSPACE/out/tailscaled"; then
            echo "::error::版本戳 $LONG 未写入 tailscaled"
            exit 1
          fi
          file "$GITHUB_WORKSPACE/out/tailscaled"

      - name: Upload tailscaled
        uses: actions/upload-artifact@v4
        with:
          name: tailscaled-mipsle
          path: out/tailscaled
          retention-days: 7
          # 已经是压缩过的机器码，再 zip 只浪费时间。
          compression-level: 0

  # ======================================================================
  # 阶段 2：镜像。用 ImageBuilder 打包（不编译内核/工具链）。
  # ======================================================================
  image:
    name: Build image (${{ github.event.inputs.profile || 'oraybox_x1' }})
    needs: tailscale
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ImageBuilder dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential zstd python3 unzip file wget curl git rsync \
            libncurses-dev libssl-dev zlib1g-dev gawk gettext xsltproc cpio

      - name: Fetch tailscaled artifact
        if: inputs.profile != 'list'
        uses: actions/download-artifact@v4
        with:
          name: tailscaled-mipsle
          path: files/usr/sbin

      - name: Prepare tailscale binary
        if: inputs.profile != 'list'
        run: |
          set -euo pipefail
          chmod +x files/usr/sbin/tailscaled
          ln -sf tailscaled files/usr/sbin/tailscale
          ls -lh files/usr/sbin/

      # 本机是办公室局域网里的一台主机，不是网关。默认的 192.168.1.1 会和
      # 主路由冲突，所以按输入值生成首启脚本，覆盖 files/ 里的默认副本。
      - name: Generate LAN defaults
        if: inputs.profile != 'list'
        env:
          LAN_MODE: ${{ github.event.inputs.lan_mode || 'auto' }}
          LAN_IP: ${{ github.event.inputs.lan_ip || '192.168.1.2' }}
          LAN_GATEWAY: ${{ github.event.inputs.lan_gateway || '192.168.1.1' }}
        run: |
          set -euo pipefail

          case "$LAN_MODE" in
            auto|static) ;;
            *) echo "::error::lan_mode 只能是 auto 或 static"; exit 1 ;;
          esac

          if [ "$LAN_MODE" = "static" ]; then
            for v in "$LAN_IP" "$LAN_GATEWAY"; do
              if ! printf '%s' "$v" | grep -Eq '^([0-9]{1,3}\.){3}[0-9]{1,3}$'; then
                echo "::error::不是合法的 IPv4 地址: $v"
                exit 1
              fi
            done
            if [ "$LAN_IP" = "$LAN_GATEWAY" ]; then
              echo "::error::lan_ip 和 lan_gateway 不能相同（会和主路由抢地址）"
              exit 1
            fi
          fi

          sed -i \
            -e "s|^LAN_MODE=.*|LAN_MODE='$LAN_MODE'|" \
            -e "s|^LAN_IP=.*|LAN_IP='$LAN_IP'|" \
            -e "s|^LAN_GATEWAY=.*|LAN_GATEWAY='$LAN_GATEWAY'|" \
            files/etc/uci-defaults/98-lan-ip
          chmod +x files/etc/uci-defaults/98-lan-ip
          grep -E "^LAN_(MODE|IP|GATEWAY)=" files/etc/uci-defaults/98-lan-ip

      # 用仓库 secret 指定 root 密码哈希；不设置的话固件里是默认密码 mt76x8。
      - name: Bake root password hash
        if: inputs.profile != 'list'
        env:
          ROOT_PASSWORD_HASH: ${{ secrets.ROOT_PASSWORD_HASH }}
        run: |
          set -euo pipefail
          chmod +x files/etc/uci-defaults/96-web-auth files/etc/uci-defaults/97-root-password
          if [ -n "$ROOT_PASSWORD_HASH" ]; then
            sed -i "s|^ROOT_HASH=.*|ROOT_HASH='$ROOT_PASSWORD_HASH'|" \
              files/etc/uci-defaults/97-root-password
            echo "已使用仓库 secret ROOT_PASSWORD_HASH"
          else
            echo "::notice::未设置 secret ROOT_PASSWORD_HASH，使用默认密码 mt76x8"
          fi

      - name: Download ImageBuilder then list profiles or build image
        env:
          PROFILE: ${{ github.event.inputs.profile || 'oraybox_x1' }}
          TS_TAG: ${{ needs.tailscale.outputs.ts_tag }}
        run: |
          set -euo pipefail

          case "$PROFILE" in
            list) ;;
            *[!A-Za-z0-9_.-]*|'')
              echo "::error::非法的 PROFILE 名称: $PROFILE"
              exit 1
              ;;
          esac

          IB_FILE="immortalwrt-imagebuilder-${IB_VERSION}-${IB_TARGET}-${IB_SUBTARGET}.Linux-x86_64.tar.xz"
          IB_URL="https://downloads.immortalwrt.org/releases/${IB_VERSION}/targets/${IB_TARGET}/${IB_SUBTARGET}/${IB_FILE}"
          IB_DIR="${IB_FILE%.tar.xz}"

          echo "Downloading $IB_URL"
          wget -q "$IB_URL"
          tar -xf "$IB_FILE"
          mv "$IB_DIR" imagebuilder
          cd imagebuilder

          if [ "$PROFILE" = "list" ]; then
            make info | tee /tmp/ib-info.txt
            {
              echo "### 可用的 mt76x8 profile"
              echo '```'
              awk '/Available Profiles:/ { found = 1 } found' /tmp/ib-info.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # USB 打印：kmod-usb-printer 提供 /dev/usb/lp0，p910nd 映射到 TCP 9100。
          # wpad/libustream 换成 mbedtls 版本，可以整个丢掉 libopenssl3(1.5 MiB)。
          #
          # 关于 -luci：默认包里还有 luci-app-opkg / luci-compat / luci-lib-ipkg，
          # 以及 default-settings（它直接依赖 luci）、default-settings-chn、
          # ipv6helper（依赖 odhcp6c/odhcpd-ipv6only）。只写 -luci 时 opkg 会把这些
          # 依赖重新拉回来，LuCI 实际仍留在固件里，因此必须逐个 negate。
          # 注意 libustream 有两层：`libustream-openssl` 是选择器/别名，
          # 真正的实现包是 `libustream-openssl20201210`。默认包列表里出现的是
          # 前者，只 negate 后者会留下 `libustream-openssl` 这个选择器，
          # opkg 最后仍装上 openssl 版并和 mbedtls 版抢
          # /lib/libustream-ssl.so。两个都要 negate。
          PACKAGES="ca-bundle kmod-tun iptables-nft uhttpd \
            kmod-usb-printer p910nd \
            wpad-basic-mbedtls libustream-mbedtls20201210 \
            -wpad-basic-openssl -libustream-openssl -libustream-openssl20201210 \
            -luci -luci-ssl -luci-app-firewall \
            -luci-app-opkg -luci-compat -luci-lib-base -luci-lib-ipkg \
            -default-settings -default-settings-chn -ipv6helper \
            -odhcpd-ipv6only -ppp -ppp-mod-pppoe -ip6tables -odhcp6c"

          echo "Building profile: $PROFILE"
          make image \
            PROFILE="$PROFILE" \
            PACKAGES="$PACKAGES" \
            FILES="$GITHUB_WORKSPACE/files"

          BIN=$(find "bin/targets/${IB_TARGET}/${IB_SUBTARGET}" -maxdepth 1 \
            -name '*sysupgrade.bin' -print -quit)
          [ -n "$BIN" ] || { echo "::error::没有生成 sysupgrade.bin"; exit 1; }

          SIZE=$(stat -c%s "$BIN")
          echo "Firmware: $BIN ($SIZE bytes)"

          # 校验 FILES 覆盖层是否真的进了 rootfs（ImageBuilder 路径写错时不会报错）。
          ROOTFS=$(find build_dir -maxdepth 2 -type d -name 'root-ramips' -print -quit)
          [ -n "$ROOTFS" ] || { echo "::error::找不到 rootfs 构建目录"; exit 1; }
          for f in \
            www/index.html \
            www/cgi-bin/ts-login.sh \
            www/cgi-bin/api.sh \
            www/cgi-bin/upgrade.sh \
            usr/lib/tsui.sh \
            etc/uci-defaults/96-web-auth \
            etc/uci-defaults/97-root-password \
            etc/uci-defaults/98-lan-ip \
            etc/uci-defaults/99-tailscale-setup \
            etc/init.d/tailscale \
            lib/upgrade/keep.d/mt76x8 \
            usr/sbin/tailscaled; do
            if [ ! -e "$ROOTFS/$f" ]; then
              echo "::error::FILES 覆盖层未生效，rootfs 缺少 $f"
              exit 1
            fi
          done
          for f in \
            www/cgi-bin/ts-login.sh \
            www/cgi-bin/api.sh \
            www/cgi-bin/upgrade.sh \
            etc/uci-defaults/96-web-auth \
            etc/uci-defaults/97-root-password \
            etc/uci-defaults/98-lan-ip \
            etc/uci-defaults/99-tailscale-setup; do
            if [ ! -x "$ROOTFS/$f" ]; then
              echo "::error::$f 在 rootfs 中没有执行权限，CGI/首次开机脚本会失效"
              exit 1
            fi
          done
          [ -L "$ROOTFS/usr/sbin/tailscale" ] || { echo "::error::tailscale 软链接缺失"; exit 1; }
          echo "FILES 校验通过: $(ls -l "$ROOTFS/usr/sbin/tailscaled" | awk '{print $5}') bytes tailscaled"

          MANIFEST=$(find "bin/targets/${IB_TARGET}/${IB_SUBTARGET}" -maxdepth 1 \
            -name '*.manifest' -print -quit)
          if [ -n "$MANIFEST" ]; then
            echo "Manifest: $MANIFEST"
            if grep -q '^luci-base ' "$MANIFEST"; then
              echo "::error::LuCI 仍在固件中（luci-base 被依赖回填），请检查 PACKAGES 的 negate 列表"
              exit 1
            fi
            echo "LuCI 已彻底移除"
            if grep -q '^libopenssl3 ' "$MANIFEST"; then
              echo "::error::libopenssl3 仍被依赖引入（约 1.5 MiB），说明 mbedtls 切换没有生效"
              exit 1
            fi
            echo "openssl 已彻底移除（mbedtls 栈生效）"
            echo "- p910nd: $(grep -c '^p910nd ' "$MANIFEST" || true)"
            echo "- kmod-usb-printer: $(grep -c '^kmod-usb-printer ' "$MANIFEST" || true)"
          fi

          {
            echo "### 构建完成"
            echo "- Tailscale: \`${TS_TAG:-n/a}\`"
            echo "- Profile: \`$PROFILE\`"
            echo "- LAN 模式: \`${{ github.event.inputs.lan_mode || 'auto' }}\`（static 时 \`${{ github.event.inputs.lan_ip || '192.168.1.2' }}\` / \`${{ github.event.inputs.lan_gateway || '192.168.1.1' }}\`）"
            echo "- 固件: \`$(basename "$BIN")\`"
            echo "- 大小: $SIZE bytes / 上限 ${MAX_FIRMWARE_BYTES} bytes"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$SIZE" -gt "$MAX_FIRMWARE_BYTES" ]; then
            echo "::error::固件 $SIZE 字节，超过 15 MiB 分区上限，禁止上传。"
            exit 1
          fi

      - name: Upload firmware artifact
        if: inputs.profile != 'list'
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-mt76x8-${{ github.event.inputs.profile || 'oraybox_x1' }}-${{ github.run_number }}
          path: |
            imagebuilder/bin/targets/ramips/mt76x8/*sysupgrade.bin
            imagebuilder/bin/targets/ramips/mt76x8/sha256sums
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      # 打 v* 标签时同时发布 Release，方便长期保存和直接下载。
      - name: Attach firmware to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && inputs.profile != 'list'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" \
              --notes "MT76x8 / OrayBox X1 Tailscale 固件 $TAG"
          gh release upload "$TAG" \
            imagebuilder/bin/targets/ramips/mt76x8/*sysupgrade.bin \
            imagebuilder/bin/targets/ramips/mt76x8/sha256sums \
            --clobber
          echo "已发布 Release: $TAG"
