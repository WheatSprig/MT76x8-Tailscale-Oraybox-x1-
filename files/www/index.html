<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1220">
<title>MT76x8 控制台</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px 14px 48px;
    background: #0b1220; color: #e8eefc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 15px; line-height: 1.6;
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { margin: 4px 0 2px; font-size: 20px; }
  .sub { margin: 0 0 16px; color: #7f90ad; font-size: 12px; }
  .card {
    margin: 0 0 14px; padding: 16px;
    border: 1px solid rgba(120,160,255,.16); border-radius: 14px;
    background: rgba(18,27,46,.9);
  }
  .card h2 {
    margin: 0 0 12px; font-size: 13px; font-weight: 700;
    letter-spacing: .08em; color: #7dd3fc; text-transform: uppercase;
  }
  .row {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 7px 0; border-top: 1px solid rgba(255,255,255,.05);
  }
  .row:first-of-type { border-top: 0; }
  .k { color: #8ea3c7; font-size: 13px; flex: 0 0 auto; }
  .v { text-align: right; word-break: break-all; font-variant-numeric: tabular-nums; }
  .ok { color: #4ade80; }
  .warn { color: #f6c177; }
  .bad { color: #f87171; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
  .field { display: flex; gap: 8px; margin-top: 10px; }
  input {
    flex: 1 1 auto; min-width: 0; padding: 10px 12px;
    border: 1px solid rgba(255,255,255,.12); border-radius: 9px;
    background: #0e1729; color: inherit; font-size: 14px;
    font-family: inherit;
  }
  input:focus { outline: 2px solid rgba(37,99,235,.55); outline-offset: 1px; }
  .btn {
    flex: 0 0 auto; padding: 10px 14px;
    border: 0; border-radius: 9px; cursor: pointer;
    background: #2563eb; color: #fff; font-size: 14px; font-weight: 700;
    font-family: inherit; text-decoration: none; display: inline-block;
    text-align: center;
  }
  .btn:active { filter: brightness(.92); }
  .btn.ghost { background: rgba(255,255,255,.08); color: #cfe0ff; }
  .btn.danger { background: #b91c1c; }
  .btn.small { padding: 7px 11px; font-size: 13px; }
  .btn[disabled] { opacity: .5; cursor: default; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .hint { margin: 10px 0 0; color: #7f90ad; font-size: 12px; line-height: 1.55; }
  #toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(80px);
    max-width: 88vw; padding: 10px 16px; border-radius: 10px;
    background: #1e293b; border: 1px solid rgba(255,255,255,.12);
    font-size: 13px; opacity: 0; transition: .2s; pointer-events: none;
  }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>
<main>
  <h1>MT76x8 控制台</h1>
  <p class="sub">Tailscale 子网路由 · USB 打印共享</p>

  <section class="card">
    <h2>状态</h2>
    <div class="row"><span class="k">Tailscale</span><span class="v" id="ts-state">—</span></div>
    <div class="row"><span class="k">Tailscale IP</span><span class="v mono" id="ts-ip">—</span></div>
    <div class="row"><span class="k">发布网段</span><span class="v mono" id="ts-routes">—</span></div>
    <div class="row"><span class="k">本机地址</span><span class="v mono" id="lan-ip">—</span></div>
    <div class="row"><span class="k">网关</span><span class="v mono" id="lan-gw">—</span></div>
    <div class="row"><span class="k">主机名</span><span class="v mono" id="hostname">—</span></div>
  </section>

  <section class="card">
    <h2>Tailscale</h2>
    <div class="actions">
      <a class="btn" href="/cgi-bin/ts-login.sh">登录 / 重新授权</a>
      <button class="btn ghost small" data-act="tailscale_logout">退出登录</button>
    </div>
    <div class="field">
      <input id="routes-input" placeholder="192.168.1.0/24" autocomplete="off">
      <button class="btn small" data-act="routes">保存网段</button>
    </div>
    <p class="hint">
      登录后需在 Tailscale 管理后台批准该网段：Machines → 本机 → Edit route settings。
      留空表示不发布子网路由。
    </p>
  </section>

  <section class="card">
    <h2>USB 打印机</h2>
    <div class="row"><span class="k">服务状态</span><span class="v" id="prn-run">—</span></div>
    <div class="row"><span class="k">设备节点</span><span class="v" id="prn-dev">—</span></div>
    <div class="row"><span class="k">监听端口</span><span class="v mono" id="prn-port">—</span></div>
    <div class="actions">
      <button class="btn small" id="prn-toggle" data-act="printer_toggle">启用 / 停用</button>
      <button class="btn ghost small" data-act="printer_restart">重启服务</button>
    </div>
    <div class="field">
      <input id="prn-device-input" placeholder="/dev/usb/lp0" autocomplete="off">
      <button class="btn small" data-act="printer_device">保存设备</button>
    </div>
    <div class="field">
      <input id="prn-port-input" placeholder="0（表示 9100）" inputmode="numeric" autocomplete="off">
      <button class="btn small" data-act="printer_port">保存端口</button>
    </div>
    <p class="hint">
      添加打印机时用 RAW / 9100 或 <span class="mono">socket://本机地址:9100</span>。
    </p>
  </section>

  <section class="card">
    <h2>系统</h2>
    <div class="actions">
      <button class="btn ghost small" id="refresh">刷新</button>
      <button class="btn danger small" data-act="reboot" data-confirm="1">重启设备</button>
    </div>
    <p class="hint">重启会断开连接，约 30 秒后恢复。</p>
  </section>
</main>

<div id="toast"></div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var toastTimer = 0;

  function toast(msg) {
    var el = $('toast');
    el.textContent = msg;
    el.className = 'show';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.className = ''; }, 2600);
  }

  function setText(id, text, cls) {
    var el = $(id);
    if (!el) return;
    el.textContent = text;
    el.className = 'v' + (cls ? ' ' + cls : '');
  }

  function stateText(s) {
    if (!s) return ['未知', 'warn'];
    if (s === 'Running') return ['已连接', 'ok'];
    if (s === 'NeedsLogin') return ['等待授权', 'warn'];
    if (s === 'Stopped') return ['已停止', 'bad'];
    return [s, 'warn'];
  }

  function refresh() {
    fetch('/cgi-bin/status.sh', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        var st = stateText(j.ts_state);
        setText('ts-state', st[0], st[1]);
        setText('ts-ip', j.ts_ip || '—');
        setText('ts-routes', j.ts_routes || '（未发布）');
        setText('lan-ip', j.lan_ip || '—');
        setText('lan-gw', j.lan_gateway || '—');
        setText('hostname', j.hostname || '—');

        var run = j.printer_running === '1'
          ? ['运行中', 'ok']
          : (j.printer_enabled === '1' ? ['已启用但未运行', 'warn'] : ['已停用', 'bad']);
        setText('prn-run', run[0], run[1]);
        setText('prn-dev', (j.printer_device || '—') + (j.printer_present === '1' ? '（已检测到）' : '（未检测到）'));
        setText('prn-port', 'TCP ' + (j.printer_tcp_port || '9100'));

        if (document.activeElement !== $('routes-input')) {
          $('routes-input').value = j.ts_routes || '';
        }
        if (document.activeElement !== $('prn-device-input')) {
          $('prn-device-input').value = j.printer_device || '';
        }
        if (document.activeElement !== $('prn-port-input')) {
          $('prn-port-input').value = j.printer_port || '';
        }
      })
      .catch(function () { toast('状态读取失败'); });
  }

  function act(cmd, extra) {
    var body = new URLSearchParams();
    body.set('do', cmd);
    if (extra) Object.keys(extra).forEach(function (k) { body.set(k, extra[k]); });
    fetch('/cgi-bin/action.sh', { method: 'POST', body: body })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        toast(j.msg || (j.ok ? '完成' : '失败'));
        refresh();
      })
      .catch(function () { toast('请求失败'); });
  }

  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act]');
    if (!el) return;
    var cmd = el.getAttribute('data-act');
    if (el.getAttribute('data-confirm') && !confirm('确定要执行吗？')) return;

    if (cmd === 'routes') {
      act(cmd, { cidr: $('routes-input').value.trim() });
    } else if (cmd === 'printer_device') {
      act(cmd, { device: $('prn-device-input').value.trim() });
    } else if (cmd === 'printer_port') {
      act(cmd, { port: $('prn-port-input').value.trim() });
    } else {
      act(cmd);
    }
  });

  $('refresh').addEventListener('click', function () { refresh(); toast('已刷新'); });
  refresh();
  setInterval(refresh, 10000);
})();
</script>
</body>
</html>
