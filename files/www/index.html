<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1220">
<title>MT76x8 Tailscale 节点配置</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 18px;
    background: radial-gradient(circle at 50% 0%, #17233b 0%, #0b1220 55%, #070b13 100%);
    color: #e8eefc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  .card {
    width: 100%;
    max-width: 460px;
    padding: 32px 24px 28px;
    border: 1px solid rgba(120, 160, 255, 0.18);
    border-radius: 20px;
    background: rgba(18, 27, 46, 0.88);
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
    text-align: center;
  }
  .badge {
    display: inline-block;
    margin-bottom: 16px;
    padding: 6px 12px;
    border: 1px solid rgba(90, 200, 250, 0.35);
    border-radius: 999px;
    color: #7dd3fc;
    font-size: 12px;
    letter-spacing: 0.08em;
  }
  h1 {
    margin: 0 0 12px;
    font-size: 24px;
    line-height: 1.35;
    font-weight: 700;
    letter-spacing: 0.01em;
  }
  p {
    margin: 0 0 22px;
    color: #a9b8d4;
    font-size: 15px;
    line-height: 1.7;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 16px 20px;
    border-radius: 12px;
    background: linear-gradient(135deg, #2563eb, #06b6d4);
    color: #ffffff;
    font-size: 17px;
    font-weight: 700;
    text-decoration: none;
    box-shadow: 0 10px 30px rgba(37, 99, 235, 0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: translateY(1px); filter: brightness(0.95); }
  .btn:hover { box-shadow: 0 14px 36px rgba(37, 99, 235, 0.5); }
  .hint {
    margin: 18px 0 0;
    padding: 12px 14px;
    border-radius: 10px;
    background: rgba(245, 158, 11, 0.08);
    border: 1px solid rgba(245, 158, 11, 0.22);
    color: #f6c177;
    font-size: 13px;
    line-height: 1.65;
    text-align: left;
  }
  .footer {
    margin-top: 20px;
    color: #64748b;
    font-size: 12px;
    line-height: 1.6;
  }
  @media (max-width: 360px) {
    .card { padding: 26px 18px 22px; }
    h1 { font-size: 21px; }
    .btn { font-size: 16px; padding: 14px 16px; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="badge">TAILSCALE NODE</div>
    <h1>MT76x8 Tailscale 节点配置</h1>
    <p>点击下方按钮，获取 Tailscale 官方授权链接并完成本节点登录。</p>

    <a class="btn" href="/cgi-bin/ts-login.sh">连接 Tailscale</a>

    <div class="hint">
      首次点击需等待 1~3 秒生成官方授权链接，请勿重复刷新。
      如果页面暂时没有跳转，请稍等几秒后再点一次。
    </div>

    <div class="footer">Tailscale 授权完成后，本页面可通过 Tailnet 访问。</div>
  </main>
</body>
</html>
